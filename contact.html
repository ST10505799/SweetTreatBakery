<!DOCTYPE html>
<html lang="en">
  <head>
       <meta charset="UTF-8">
       <meta name viewport"
  content="width=device-width,initial-scale=1.0">
        <meta name="description"
  content="Contact Sweet Treat Bakery for questions, feedback and general enquiries.">
        <title> Contact Us | Sweet Treat Bakery</title>
        <link rel="stylesheet"
  href="style.css">
  </head>
  <body>

      <header>
         <h1>Sweet Treat Bakery</h1>
        <h2>Contact Us</h2>
      </header>

    <main>
         <p>We would love to hear hear from you! Please complete the form below.</p>

        <form id="contactForm">
             <label for="name">Full Name:</label>
             <input type="text"
    id="name=" name="name required>
               
<label for="phone">Phone Number:</label>
      <input type="tel" id="phone"name="phone" required>
          
              <label for="email">Email Address:</label>
              <input type="email"
    id="email" name="email" required>

              <label 
    for="subject">Subject:</label>
               <input type="text"
    id="subject" name="subject" required>

    <label for="messageType">Type of Message:</label>
        <select id="messageType"name="messageType" required>
          <option value="">Select a message type</option>
           <option value="GeneralEnquiry">General Enquiry</option>
            <option value="ProductFeedback">Product Feedback</option>
            <option value="Complaint">Complaint</option>option>
            <option value="Other">Other</option>
        </select>

                <label for="message">Your Message:</label>
                <textarea id="message"
      name="message" required></textarea>

                 <button type="submit">Send Message</button>

      <p><a href="index.html">Back to Home</a></p>
                 </main>
                
  </body>
</html>
