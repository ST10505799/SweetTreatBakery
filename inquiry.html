<!DOCTYPE html>
<html lang="en">
<head>
  <mata charset="UTF-8">
  <meta name="viewport"
content="width=device-width, initial-scale=1.0">
  <meta name="description"
content="Send a product or service enquiry to Sweet Treat Bakery.">
  <title>Product Enquiry | Sweet Treat Bakery</title>
  <link rel="stylesheet"
href="style.css">
</head>
<body>

</header>
   <h1>Sweet Treat Bakery</h1>
   <h2>Product Enquiry Form</h2>
</header>

  <main>
      <p>Interested in our delicious trats? Complete the form below.</p>

       <form id="inquiryForm">
           <label for="name">Full Name:</label>
            <input type="text"
    id="name" name="name" required>

             <label for="email">Email Address:</label>
              <input type="email"
    id="email" name="email" required>
              <label for"product">Product of Interest:</label>
              <select id="product"
    name="product" required>
                    <option value="">Select a product</option>
                                <option
        value="Cupcakes">Cupcakes</option>
                                <option
        value="Cakes">Cakes</option>
                          <option
        value="Cookies">cookies</option>
                         <option
        value="Other">Other</option>
                      </select>

                      <label for="message">Your Enquiry:</label>
                      <textarea id="message"
          name="message" required></textarea>

                       <button
        type="submit">Submit Enquiry</button></form>

                        <p><a href="index.html">Back to Home</a></p>            
  </main>
  
<script src="script.js"></script>
  
</body>
</html>
